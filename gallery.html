<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            color: rgb(212, 152, 79);

        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 255, 255, 0.05), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(255, 255, 255, 0.04), transparent 35%),
                linear-gradient(135deg, #000000, #111111, #1a1a1a, #000000);
            background-size: cover;
            background-attachment: fixed;
            font-family: "Playfair Display", serif;

        }

        .arrow {
            position: absolute;
           
        }
        .box1{
            margin: 20px;
            border: 2px solid rgb(178, 144, 31);
            margin-bottom: 10px;
        }
        

        .box1 h1,
        p {
            text-align: center;
            padding: 20px;
        }

        .card:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .carousel-inner {
            width: 1400px;
            height: 550px;
            padding-left: 100px;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border: 2px solid rgb(246, 244, 240);

        }

        .sub {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 90px;

        }
    </style>
</head>

<body>
    <div class="box1">
        <a href="/index" class="arrow">
            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="50" fill="currentColor" class="bi bi-arrow-left"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8" />
            </svg>
        </a>
        <h1>GALLERY</h1>
        <P>✦A glimpse of our food,ambiance and moments✦</P>


        <div id="carouselExampleAutoplaying" class="carousel slide carousel-fade" data-bs-ride="carousel"
            data-bs-interval="3000" data-bs-pause="false" data-bs-wrap="true">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src='restaurant image.png' class="d-block">
                
                </div>
                <div class="carousel-item">
                    <img src='interior.png' class="d-block">
                </div>
                <div class="carousel-item">
                    <img src='outdoor sitting.png' class="d-block">

                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div><br><br>
        <div class="sub">

            <div class="card" style="width:20rem;">
                    <img src="dining area.png" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Dining Area</h5>
                </div>
            </div>
            <div class="card" style="width:20rem;">
                    <img src='chef.png' class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Chef</h5>
                </div>
            </div>
            <div class="card" style="width:20rem;">
                    <img src='dessert.png' class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Dessert</h5>
                </div>
            </div>
            <div class="card" style="width:20rem;">
                    <img src='dish2.png' class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Royal Chocolate Dome</h5>
                </div>
            </div>
            <div class="card" style="width:20rem;">
                    <img src='dish3.png' class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Duck Duo</h5>
                </div>
            </div>
            <div class="card" style="width: 20rem;">
                    <img src='dish4.png' class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title">Tuna Tartare</h5>
                </div>
            </div>

        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
